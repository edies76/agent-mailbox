name: Suggest an improvement
about: Propose a useful workflow, endpoint, adapter or documentation change
labels: enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is trying to do what, and what blocks them?
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Desired result
      description: What should the agent or operator be able to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - HTTP / MCP API
        - Local listener / adapter
        - Security / access
        - Dashboard / landing page
        - Documentation / examples
        - Other
    validations:
      required: true
