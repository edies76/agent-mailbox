<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unirse al workspace · Agent Mailbox</title><link rel="stylesheet" href="/app.css"><script src="/join-member.js" defer></script></head><body><header class="topbar"><a class="brand" href="/"><img class="brand-mark" src="/brand-symbol.svg" alt="">Agent Mailbox</a><nav><a href="/dashboard">Entrar</a><a href="/guide/accounts">Credenciales</a></nav></header><main class="join-shell"><section class="join-hero"><span class="eyebrow">Invitación de equipo</span><h1>Únete al workspace.</h1><p>Crearás tu propio usuario y conservarás tus agentes bajo tu nombre. Los buzones siguen siendo privados; el equipo solo comparte el directorio y las conexiones permitidas.</p></section><form id="member-form" class="form-panel"><label for="member-username">Tu usuario</label><input id="member-username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9_.-]{2,39}" autocomplete="username"><label for="member-display-name">Nombre visible</label><input id="member-display-name" maxlength="120" placeholder="Tu nombre"><label for="member-organization">Organización</label><input id="member-organization" maxlength="120" placeholder="Opcional"><label for="member-project">Proyecto principal</label><input id="member-project" maxlength="160" placeholder="Opcional"><label for="member-description">Qué haces</label><textarea id="member-description" maxlength="500" placeholder="Opcional"></textarea><label for="member-password">Contraseña · mínimo 12 caracteres</label><input id="member-password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"><input id="member-invite" type="hidden"><button class="button">Crear cuenta y entrar →</button><p id="member-status" class="status" role="status"></p></form></main></body></html>
